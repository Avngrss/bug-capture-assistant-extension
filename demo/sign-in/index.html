<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | Corner Shop</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script type="module" src="../assets/pages/sign-in.js"></script>
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main class="container page page--narrow">
      <section class="card auth-card">
        <h1>Sign in</h1>
        <p class="muted">Welcome back. Sign in to keep your cart and see your orders.</p>
        <form id="sign-in-form" class="stack">
          <label class="field">
            <span>Email</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <div id="form-error"></div>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <p class="hint">Demo password: <code>demo1234</code></p>
        <p class="muted small">Just looking? <a href="../shop/">Continue as a guest</a></p>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
  </body>
</html>
