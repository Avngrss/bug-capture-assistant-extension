<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop | Corner Shop</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script type="module" src="../assets/pages/shop.js"></script>
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main class="container page">
      <section class="hero">
        <p class="eyebrow">Autumn picks</p>
        <h1>Small things that make the day better</h1>
        <p class="muted">Free delivery on orders over $50. New customers get 10% off with <strong>WELCOME10</strong>.</p>
      </section>
      <form id="search-form" class="search-form" role="search">
        <label class="visually-hidden" for="search">Search products</label>
        <input id="search" name="q" type="search" placeholder="Search products, e.g. men's watch" autocomplete="off" />
        <button class="btn btn-secondary" type="submit">Search</button>
      </form>
      <div class="section-head">
        <h2 id="results-heading">All products</h2>
        <span id="product-count" class="muted"></span>
      </div>
      <div id="products" class="product-grid">
        <p class="muted">Loading products…</p>
      </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
  </body>
</html>
